name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          name="codegrapher_${tag}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"

          bin="codegrapher"
          if [ "${GOOS}" = "windows" ]; then
            bin="codegrapher.exe"
          fi

          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/specscore/codegrapher/internal/cli.Version=${version}" \
            -o "dist/${name}/${bin}" \
            ./cmd/codegrapher

          cp README.md LICENSE NOTICE "dist/${name}/"

          (
            cd dist
            if [ "${GOOS}" = "windows" ]; then
              zip -qr "${name}.zip" "${name}"
              sha256sum "${name}.zip" > "${name}.zip.sha256"
            else
              tar -czf "${name}.tar.gz" "${name}"
              sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            fi
          )

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: codegrapher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          cat > release-notes.md <<EOF
          Release ${tag}

          This release is built by GitHub Actions from tag ${tag}.

          Install with:

          \`\`\`sh
          go install github.com/specscore/codegrapher/cmd/codegrapher@latest
          \`\`\`
          EOF

          gh release create "${tag}" dist/* \
            --title "${tag}" \
            --notes-file release-notes.md \
            --verify-tag
