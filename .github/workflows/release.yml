name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it in one run (GoReleaser against this repo's .goreleaser.yaml —
# all-OS binaries to the GitHub release + a Homebrew cask). Pushing an explicit
# `vX.Y.Z` tag also works and releases that exact version. A docs/chore-only
# merge cuts no tag and publishes nothing.
#
# codegrapher is pre-1.0: allow_major_version_bump stays false, so a stray
# `feat!:` is capped to a minor bump instead of jumping to v1.0.0. Cut v1.0.0
# deliberately by pushing that tag.
#
# The Homebrew cask (see .goreleaser.yaml) publishes to specscore/homebrew-tap
# and needs a GORELEASER_GITHUB_TOKEN secret with Contents:write on that tap;
# until that secret is set the cask push fails (the GitHub release still ships).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time; a second push queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Pinned to an exact tag. The moving @v1 tag has been retired: it drifted
    # 14 patch releases behind while still accepting newer inputs, so a
    # configured release gate silently did nothing.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.15
    permissions:
      contents: write
    with:
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump.
      allow_major_version_bump: false
    secrets:
      # Cross-repo PAT with Contents:write on specscore/homebrew-tap (the cask
      # target), forwarded to GoReleaser as $GORELEASER_GITHUB_TOKEN.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yaml, which is gated on MACOS_SIGN_P12 being set. See
      # ingitdb/ingitdb-cli's release.yml, the reference implementation this
      # block is copied from.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}
