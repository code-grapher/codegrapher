name: Go CI

on:
  # Scope push to main (+ release tags) only; PR branches are covered by the
  # pull_request trigger below. This avoids running every job twice on a PR
  # (once for the branch push, once for the pull_request event).
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    # Reusable Go CI workflow: go get/vet/build/test + golangci-lint, and
    # version-bump-and-tag on main. Defaults to CGO_ENABLED=0, which matches
    # codegrapher's single-static-binary / cross-compilation launch requirement
    # (no cgo_enabled override needed — the parser and SQLite driver are pure Go).
    #
    # Pinned to an exact tag, not the moving @v1 tag: @v1 has been retired
    # because it drifted patch releases behind while still accepting inputs
    # it did not implement, so a configured input could silently no-op.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.14.17

    with:
      # Version bump + release now happen in release.yml (continuous delivery on
      # push to main, via GoReleaser). This workflow only builds/lints/tests —
      # disable its bump so it does not create a competing tag.
      disable-version-bumping: true

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fail fast on go.mod/go.sum drift.
  #
  # This is the signal that would have caught datatug-cli's v0.13.2 before it
  # shipped: two renovate pull requests for the same major bump interleaved and
  # left go.mod requiring a version nothing imported. Build-and-test caught the
  # stale imports only after both had merged; an untidy go.mod is visible on the
  # FIRST of the pair, on its own pull request.
  #
  # `-diff` only reports; it never rewrites go.mod, so unlike a mutating
  # `go mod tidy` it cannot mask the drift it is meant to find. This job belongs
  # to the workflow named by release.yml's `require_workflow_success`, so drift
  # also blocks the release, not just the merge.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must be >= this repo's go.mod `go` directive.
          go-version: '1.27.0'
          cache: true
      - name: go mod tidy -diff
        run: go mod tidy -diff

  daemon-platform:
    name: daemon lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Test daemon package and built-binary lifecycle
        run: go test -count=1 ./daemon

  browser-api:
    name: generated client real-browser journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contract
      - run: pnpm test:contract-drift
      - run: pnpm build:client
      - run: pnpm test:client-package
      - name: Run generated-client journey in Chrome
        env:
          CODEGRAPH_BROWSER_E2E: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: go test -count=1 -run TestRealBrowserGeneratedClientJourney ./browserapi
