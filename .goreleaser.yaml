version: 2

project_name: codegrapher

before:
  hooks:
    - go mod tidy

builds:
  - id: codegrapher
    main: ./cmd/codegrapher
    binary: codegrapher
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on arm64 was never published by the prior manual matrix.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/strongo/buildinfo.version={{.Version}}
      - -X github.com/strongo/buildinfo.commit={{.FullCommit}}
      - -X github.com/strongo/buildinfo.date={{.Date}}

archives:
  - id: archive
    ids: [codegrapher]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Stable, OS/arch-templated name (matches the prior manual archive naming).
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: checksums.txt

# macOS signing + notarization — DORMANT unless MACOS_SIGN_P12 is set, in
# which case the shared strongo/cicd release.yml forwards it (and the other
# four Apple secrets) to this job. GoReleaser's notarize is pure Go (quill),
# so this runs on the existing job — no macOS runner needed. See
# ingitdb/ingitdb-cli's .goreleaser.yaml, the reference implementation this
# block is copied from.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [codegrapher]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        wait: true
        issuer_id: "{{ .Env.NOTARIZE_ISSUER_ID }}"
        key_id: "{{ .Env.NOTARIZE_KEY_ID }}"
        key: "{{ .Env.NOTARIZE_KEY }}"
        timeout: 20m

release:
  github:
    owner: code-grapher
    name: codegrapher

# Homebrew cask (ecosystem standard; `brews:` is deprecated — see strongo/cicd
# README "Packaging conventions"). GoReleaser auto-installs the codegrapher
# binary from the archive. Published to the shared specscore tap (the module is
# github.com/specscore/codegrapher), alongside the specscore cask:
#   brew install --cask specscore/tap/codegrapher
homebrew_casks:
  - name: codegrapher
    ids: [archive]
    description: "codegrapher – a free Go tool that builds a graph of your codebase"
    homepage: https://github.com/code-grapher/codegrapher
    license: Apache-2.0
    repository:
      owner: specscore
      name: homebrew-tap
      # Cross-repo PAT with Contents:write on specscore/homebrew-tap, forwarded
      # by the shared strongo/cicd release.yml as $GORELEASER_GITHUB_TOKEN.
      token: "{{ .Env.GORELEASER_GITHUB_TOKEN }}"
